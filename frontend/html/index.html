<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Voygan — Tourism Chatbot</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/style.css" />
  <script src="/static/script.js" defer></script>
</head>
<body class="bg-slate-50 text-slate-900">
  <div class="max-w-xl mx-auto p-4 sm:p-6">

    <div id="chat" class="space-y-3 mb-24"></div>

    <div class="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur border-t">
      <div class="max-w-xl mx-auto p-3">
        <div class="flex gap-2 mt-0">
          <input id="msg" class="input flex-1" placeholder="Type your message…" />
          <button id="send" class="btn">Send</button>
        </div>
      </div>
    </div>

  </div> 
</body>
</html>
